
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAO OMNI V52 - Supabase</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px;
      background: #08080a; color: #f4f4f5;
      font-family: system-ui, sans-serif;
    }
    main {
      max-width: 600px; margin: 30px auto;
      padding: 24px; background: #15151b;
      border: 1px solid #303039; border-radius: 20px;
    }
    h1 { color: #39d6a0; }
    label { display: block; margin-top: 18px; }
    input {
      display: block; width: 100%; margin-top: 8px;
      padding: 13px; border-radius: 10px;
      border: 1px solid #454550;
      background: #09090c; color: white;
    }
    button {
      width: 100%; padding: 14px; margin-top: 16px;
      border: 0; border-radius: 10px;
      background: #39d6a0; color: #07110d;
      font-weight: bold; font-size: 16px;
    }
    #result {
      white-space: pre-wrap; overflow-wrap: anywhere;
      margin-top: 20px; padding: 14px;
      background: #09090c; border-radius: 10px;
    }
    small { color: #aaa; }
  </style>
</head>
<body>
<main>
  <h1>HAO OMNI V52</h1>
  <p>Supabase Connection</p>

  <label>Project URL
    <input id="url" type="url"
      value="https://vdszqtqbywcozkolaytu.supabase.co">
  </label>

  <label>Publishable Key
    <input id="key" type="password"
      value="sb_publishable_9r_4K2uRC_tm-Q7405KI2w_AnIUexg0">
  </label>

  <button id="save">Simpan Konfigurasi</button>
  <button id="test">Tes Koneksi</button>
  <button id="open">Buka Endpoint Supabase</button>

  <div id="result">Siap. Tekan Tes Koneksi.</div>
  <p><small>
    Gunakan publishable key saja di browser.
    Jangan masukkan secret key.
  </small></p>
</main>

<script>
const $ = id => document.getElementById(id);
const result = $('result');

function getConfig() {
  const url = $('url').value.trim().replace(/\/+$/, '');
  const key = $('key').value.trim();

  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)) {
    throw Error('Format Project URL tidak valid.');
  }
  if (!key || /sb_secret_|service_role/i.test(key)) {
    throw Error('Gunakan publishable key, bukan secret key.');
  }
  return { url, key };
}

$('save').onclick = () => {
  try {
    const config = getConfig();
    localStorage.setItem(
      'hao_supabase_public_config',
      JSON.stringify(config)
    );
    result.textContent = 'Konfigurasi berhasil disimpan di browser.';
  } catch (e) {
    result.textContent = e.message;
  }
};

$('open').onclick = () => {
  try {
    const { url } = getConfig();
    window.open(
      url + '/auth/v1/health',
      '_blank',
      'noopener'
    );
    result.textContent =
      'Endpoint dibuka. Periksa hasil di tab baru.';
  } catch (e) {
    result.textContent = e.message;
  }
};

$('test').onclick = async () => {
  let timer;

  try {
    const { url, key } = getConfig();
    result.textContent = 'Menguji koneksi Supabase...';

    const controller = new AbortController();
    timer = setTimeout(() => controller.abort(), 12000);

    const response = await fetch(url + '/auth/v1/settings', {
      method: 'GET',
      headers: {
        apikey: key,
        Authorization: 'Bearer ' + key
      },
      signal: controller.signal,
      cache: 'no-store'
    });

    const body = await response.text();

    if (response.ok) {
      result.textContent =
        'KONEKSI BERHASIL (HTTP ' + response.status + ').\n' +
        'Endpoint Auth merespons. Login dan database belum diuji.';
    } else {
      result.textContent =
        'Supabase merespons HTTP ' + response.status +
        '\nRespons: ' + body.slice(0, 500) +
        '\nPeriksa URL, key, dan konfigurasi project.';
    }
  } catch (e) {
    result.textContent = e.name === 'AbortError'
      ? 'Waktu koneksi habis. Periksa jaringan dan URL project.'
      : 'GAGAL TERHUBUNG.\n' + e.message +
        '\n\nBuka endpoint untuk memeriksa DNS dan status project. ' +
        'Jika ERR_NAME_NOT_RESOLVED muncul, periksa Project URL ' +
        'di Settings → API pada dashboard Supabase.';
  } finally {
    clearTimeout(timer);
  }
};

// Muat konfigurasi tersimpan jika tersedia.
try {
  const saved = JSON.parse(
    localStorage.getItem('hao_supabase_public_config') || 'null'
  );
  if (saved) {
    $('url').value = saved.url;
    $('key').value = saved.key;
  }
} catch (_) {}
</script>
</body>
</html>
